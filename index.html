<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#728d9c" />
    <title>City Capital</title>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="City Capital 3D prototype scene"></canvas>
    <header class="game-header">
      <p class="eyebrow">CITY BUILDING &amp; PROPERTY TRADING</p>
      <h1>City Capital</h1>
      <p class="subtitle">Property Trading Prototype</p>
      <p class="status" id="status" role="status">Loading prototype scene…</p>
    </header>
    <section class="turn-panel" aria-label="Turn controls">
      <div class="turn-status" aria-live="polite">
        <div><span>Last roll</span><strong id="dice-value">—</strong></div>
        <div><span>Position</span><strong id="position-value">0 / 12</strong></div>
        <div><span>Location</span><strong id="location-value">START</strong></div>
      </div>
      <button id="roll-dice" type="button">Roll Dice</button>
    </section>
    <aside class="property-panel" id="property-panel" aria-live="polite" hidden>
      <p class="panel-label">PROPERTY DETAILS</p>
      <h2 data-property="name"></h2>
      <dl>
        <div><dt>Property ID</dt><dd data-property="id"></dd></div>
        <div><dt>Purchase price</dt><dd data-property="price"></dd></div>
        <div><dt>Base rent</dt><dd data-property="rent"></dd></div>
        <div><dt>Owner</dt><dd data-property="owner"></dd></div>
        <div><dt>Building level</dt><dd data-property="level"></dd></div>
      </dl>
    </aside>
    <p class="controls">Click a plot for details <span aria-hidden="true">·</span>Drag to orbit <span aria-hidden="true">·</span> Scroll to zoom</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
